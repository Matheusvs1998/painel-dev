<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#00ff9d" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="screen-orientation" content="landscape" />
  <meta name="x5-orientation" content="landscape" />
  <meta name="description" content="DevSystem — Dashboard de Monitoramento e Integração para Desenvolvedores" />
  <title>DevSystem</title>
  <script>
    // Recuperação automática se o navegador tentar carregar hash antigo preso em cache
    window.addEventListener('error', function (e) {
      if (e.target && e.target.tagName === 'SCRIPT' && !sessionStorage.getItem('chunk_reload_done')) {
        sessionStorage.setItem('chunk_reload_done', 'true');
        if ('caches' in window) {
          caches.keys().then(function (names) {
            return Promise.all(names.map(function (n) { return caches.delete(n); }));
          }).then(function () {
            window.location.reload(true);
          });
        } else {
          window.location.reload(true);
        }
      }
    }, true);
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
