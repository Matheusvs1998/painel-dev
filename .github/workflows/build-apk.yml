name: Compilar APK Android (DevSystem)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Gerar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK Platform 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar Frontend (Vite Build)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: Conceder Permissão de Execução ao Gradle
        run: chmod +x android/gradlew

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sincronizar Assets do Capacitor
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/
          npx cap sync android || true

      - name: Compilar APK (assembleDebug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon
          cd ..
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/DevSystem.apk || true

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: DevSystem-APK-Android
          path: android/app/build/outputs/apk/debug/DevSystem.apk
          retention-days: 30
