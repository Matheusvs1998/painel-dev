name: Compilar APK Android (DevSystem)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Gerar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependências
        run: npm ci

      - name: Compilar Frontend (Vite Build)
        run: npm run build

      - name: Conceder Permissão de Execução ao Gradle
        run: chmod +x android/gradlew

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sincronizar Capacitor Android
        run: npx cap sync android || npx cap copy android

      - name: Compilar APK (assembleDebug)
        run: cd android && ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: DevSystem-APK-Android
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
